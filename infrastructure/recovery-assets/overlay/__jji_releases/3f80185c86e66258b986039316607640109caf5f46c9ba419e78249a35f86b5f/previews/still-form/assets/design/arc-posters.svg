<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050" role="img" aria-labelledby="title desc"><title id="title">ARC programme poster series</title><desc id="desc">Three posters for fictional open studios, conversations and screenings, sharing an arc motif and consistent information grid.</desc><rect width="1400" height="1050" fill="#f2efe2"/><g font-family="Helvetica Neue,Arial,sans-serif"><text x="60" y="75" font-size="24" letter-spacing="4">ARC / PROGRAMME POSTERS</text><g transform="translate(60 135)"><rect width="400" height="800" fill="#efa88d"/><path d="M65 395a135 135 0 0 1 270 0" fill="none" stroke="#24251f" stroke-width="48"/><text x="30" y="80" font-size="80" font-weight="800">ARC</text><text x="30" y="550" font-size="49" font-weight="700">OPEN</text><text x="30" y="610" font-size="49" font-weight="700">STUDIOS</text><text x="30" y="735" font-size="19">01 / PROGRAMME STUDY</text></g><g transform="translate(500 135)"><rect width="400" height="800" fill="#c7cdb0"/><circle cx="200" cy="350" r="135" fill="none" stroke="#24251f" stroke-width="48" stroke-dasharray="630 220" transform="rotate(-40 200 350)"/><text x="30" y="80" font-size="80" font-weight="800">ARC</text><text x="30" y="550" font-size="44" font-weight="700">IN</text><text x="30" y="610" font-size="44" font-weight="700">CONVERSATION</text><text x="30" y="735" font-size="19">02 / PROGRAMME STUDY</text></g><g transform="translate(940 135)"><rect width="400" height="800" fill="#24251f"/><path d="M65 350a135 135 0 0 0 270 0" fill="none" stroke="#f2efe2" stroke-width="48"/><g fill="#f2efe2"><text x="30" y="80" font-size="80" font-weight="800">ARC</text><text x="30" y="550" font-size="49" font-weight="700">AFTER</text><text x="30" y="610" font-size="49" font-weight="700">HOURS</text><text x="30" y="735" font-size="19">03 / SCREENING STUDY</text></g></g><text x="60" y="1000" font-size="20">Fictional events • Layout studies, not an announced programme</text></g></svg>