<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050" role="img" aria-labelledby="title desc"><title id="title">NOON label hierarchy</title><desc id="desc">An annotated label flat identifies the wordmark, flavour, illustrative volume and concept disclosure, with a repeatable sunny pattern.</desc><rect width="1400" height="1050" fill="#f4efe0"/><g font-family="Helvetica Neue,Arial,sans-serif"><text x="65" y="85" font-size="24" letter-spacing="4">NOON / LABEL HIERARCHY</text><rect x="65" y="150" width="670" height="790" fill="#f0d943"/><g fill="#234632"><text x="105" y="360" font-size="170" font-weight="800" letter-spacing="-16">NOON</text><circle cx="400" cy="565" r="130" fill="#fff4bb"/><path d="M400 435v260M270 565h260" stroke="#234632" stroke-width="2"/><text x="105" y="790" font-size="44" font-weight="700">LEMON</text><text x="105" y="850" font-size="25">330 mL / FICTIONAL PRODUCT</text><text x="105" y="895" font-size="19">DESIGN CONCEPT — NOT FOR SALE</text><g font-size="25"><text x="830" y="270">01 / A wordmark seen first</text><text x="830" y="400">02 / One shared sun motif</text><text x="830" y="530">03 / Flavour as wayfinding</text><text x="830" y="660">04 / Useful supporting detail</text></g><path d="M790 730h545" stroke="#234632"/><text x="830" y="790" font-size="23">Artwork flat, not a production dieline.</text><text x="830" y="840" font-size="23">Ingredients, legal copy and print</text><text x="830" y="880" font-size="23">specifications are outside this study.</text></g></g></svg>