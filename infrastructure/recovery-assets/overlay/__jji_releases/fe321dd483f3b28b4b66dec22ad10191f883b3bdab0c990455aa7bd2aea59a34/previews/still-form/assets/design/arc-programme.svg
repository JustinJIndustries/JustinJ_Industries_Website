<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="0 0 1400 1050" role="img" aria-labelledby="title desc"><title id="title">ARC folded programme layout</title><desc id="desc">An open editorial programme with a strong ARC masthead, numbered listings, time blocks and accessible text hierarchy.</desc><rect width="1400" height="1050" fill="#d9d7ca"/><g font-family="Helvetica Neue,Arial,sans-serif"><text x="65" y="80" font-size="25" letter-spacing="4">ARC / PROGRAMME SYSTEM</text><rect x="65" y="140" width="1270" height="800" fill="#fffdf6"/><rect x="65" y="140" width="380" height="800" fill="#efa88d"/><text x="95" y="300" font-size="140" font-weight="800" letter-spacing="-12">ARC</text><text x="95" y="395" font-size="47" font-weight="700">OPEN</text><text x="95" y="455" font-size="47" font-weight="700">PROGRAMME</text><path d="M145 785a105 105 0 0 1 210 0" fill="none" stroke="#24251f" stroke-width="40"/><g fill="#24251f"><text x="505" y="220" font-size="21" letter-spacing="3">A DAY OF NEW PERSPECTIVES</text><text x="505" y="315" font-size="30">01 / Open studios</text><text x="1120" y="315" font-size="25">10:00</text><path d="M505 350h760" stroke="#24251f"/><text x="505" y="430" font-size="30">02 / In conversation</text><text x="1120" y="430" font-size="25">14:00</text><path d="M505 465h760" stroke="#24251f"/><text x="505" y="545" font-size="30">03 / After hours</text><text x="1120" y="545" font-size="25">18:00</text><path d="M505 580h760" stroke="#24251f"/><text x="505" y="720" font-size="25">One clear grid for people, places and times.</text><text x="505" y="780" font-size="22">Fictional listings • Editorial prototype</text><text x="505" y="835" font-size="22">Fold and print production remain to be specified.</text></g></g></svg>