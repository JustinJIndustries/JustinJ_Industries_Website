name: Protected M1 public verification proof
on:
  workflow_dispatch:
    inputs:
      checkpoint_claim:
        description: Exact parent run, request artifact ID and request digest JSON
        required: true
      m1_public_proof:
        description: Fresh proof generated by the reviewed owner M1 helper
        required: true
permissions:
  contents: read
  actions: read
# Separate from the parent's pages lock: proof must complete while parent waits.
concurrency:
  group: m1-public-proof
  cancel-in-progress: false
jobs:
  proof:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.actor == 'JustinJIndustries'
    environment: failover-sync
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CHECKPOINT_CLAIM: ${{ inputs.checkpoint_claim }}
      M1_PUBLIC_PROOF: ${{ inputs.m1_public_proof }}
      GH_READ_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - name: Validate owner, main control and current parent request metadata
        run: node infrastructure/failover/checkpoint-proof-ci.mjs guard
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ env.CHECKPOINT_REQUEST_ARTIFACT_ID }}
          run-id: ${{ env.CHECKPOINT_PARENT_RUN_ID }}
          github-token: ${{ github.token }}
          merge-multiple: true
          path: ${{ runner.temp }}/jji-public-proof/request
      - name: Validate fresh complete M1 evidence and bounded retention
        run: node infrastructure/failover/checkpoint-proof-ci.mjs record
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.PUBLIC_PROOF_NAME }}
          path: ${{ runner.temp }}/jji-public-proof/record/
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
