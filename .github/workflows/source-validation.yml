name: JJI source validation
on:
  pull_request:
    branches: [main, release-control]
  workflow_dispatch:
permissions: {}
jobs:
  public-source:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Provision the pinned Chrome sandbox before checking out source
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          CHROME_VERSION: 157.0.8103.78
          CHROME_SHA256: 9223832977a13db3646201b1341c1f9cf08afa3ceae92540116d7b0c062364fb
        run: |
          set -euo pipefail
          archive=$(mktemp)
          curl --fail --silent --show-error --retry 3 --proto '=https' \
            "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/linux64/chrome-linux64.zip" \
            --output "$archive"
          # Create a new root-owned installation. Authenticate the root-owned copy before extraction.
          sudo mkdir -m 0755 /opt/jji-ci-chrome
          sudo install -o root -g root -m 0600 "$archive" /opt/jji-ci-chrome/chrome.zip
          printf '%s  /opt/jji-ci-chrome/chrome.zip\n' "$CHROME_SHA256" | sudo sha256sum --check --strict
          sudo unzip -q /opt/jji-ci-chrome/chrome.zip -d /opt/jji-ci-chrome
          sudo chmod -R a-s,go-w /opt/jji-ci-chrome/chrome-linux64
          # Permit user namespaces for this exact root-owned executable on this ephemeral runner.
          sudo apparmor_parser --add --skip-cache <<'PROFILE'
          abi <abi/4.0>,
          include <tunables/global>
          profile jji-ci-chrome /opt/jji-ci-chrome/chrome-linux64/chrome flags=(unconfined) {
            userns,
          }
          PROFILE
          echo "PUPPETEER_EXECUTABLE_PATH=/opt/jji-ci-chrome/chrome-linux64/chrome" >> "$GITHUB_ENV"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - name: Scan the checked-out Git index for credentials
        run: python3 scripts/check-secret-blobs.py
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check:html
      - run: npm run check:links
      - run: npm run check:public-content
      - run: node --test tests/*.test.mjs infrastructure/cloudflare-manual/preflight.test.mjs
      - name: Check inquiry consent on all six routes with intercepted requests
        run: node scripts/check-design-consent.mjs --require-pinned-browser
      - name: Verify the checks reject disposable negative fixtures
        run: python3 tests/ci/check-security-fixtures.py
